name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kittors/clirelay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Reject vendored panel assets
        run: ./scripts/ensure-no-vendored-panel-assets.sh

      - name: Compute build metadata
        id: build_meta
        run: |
          set -euo pipefail
          REF_NAME="${GITHUB_REF_NAME:-main}"
          BACKEND_SHORT="$(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then
            # Release tags pin the backend commit while using the released frontend from main.
            FRONTEND_REF="main"
            VERSION="${REF_NAME}"
            UI_VERSION_REF="${REF_NAME}"
          else
            FRONTEND_REF="${REF_NAME}"
            VERSION="${REF_NAME}-${BACKEND_SHORT}"
            UI_VERSION_REF="${FRONTEND_REF}"
          fi
          FRONTEND_COMMIT="$(git ls-remote https://github.com/kittors/codeProxy.git "refs/heads/${FRONTEND_REF}" | awk '{print $1}')"
          if [ -z "${FRONTEND_COMMIT}" ]; then
            echo "Unable to resolve frontend ref: ${FRONTEND_REF}" >&2
            exit 1
          fi
          FRONTEND_SHORT="${FRONTEND_COMMIT:0:7}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "UI_VERSION=panel-${UI_VERSION_REF}-${FRONTEND_SHORT}" >> "$GITHUB_ENV"
          echo "FRONTEND_REF=${FRONTEND_REF}" >> "$GITHUB_ENV"
          echo "FRONTEND_COMMIT=${FRONTEND_COMMIT}" >> "$GITHUB_ENV"
          echo "backend_short=${BACKEND_SHORT}" >> "$GITHUB_OUTPUT"
          echo "frontend_short=${FRONTEND_SHORT}" >> "$GITHUB_OUTPUT"
          echo "frontend_commit=${FRONTEND_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_type == 'tag' }}
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=ref,event=tag
            type=raw,value=${{ github.ref_name }}-${{ steps.build_meta.outputs.backend_short }}
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Get build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.date }}
            UI_VERSION=${{ env.UI_VERSION }}
            FRONTEND_REF=${{ env.FRONTEND_REF }}
            FRONTEND_COMMIT=${{ env.FRONTEND_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
