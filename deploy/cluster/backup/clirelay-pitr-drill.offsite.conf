# Drop-in for the offsite host:
#   /etc/systemd/system/clirelay-pitr-drill.service.d/offsite.conf
# The drill proves the copies on this host restore, so it pulls first: the
# replay then reaches minutes, not up to a pull interval, before the drill.
[Service]
ExecStartPre=/opt/clirelay-cluster/backup/offsite-pull.sh
